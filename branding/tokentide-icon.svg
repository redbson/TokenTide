  <rect x="281.28" y="281.28" width="329.6" height="123.6" rx="61.8" fill="url(#codex)"/>
  <rect x="450.2" y="454.32" width="123.6" height="304.88" rx="61.8" fill="#34363c"/>
  <rect x="450.2" y="561.44" width="123.6" height="197.76" rx="61.8" fill="url(#claude)"/>
</svg>
