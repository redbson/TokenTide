<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>TokenTide</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2e34"/>
      <stop offset="1" stop-color="#17181b"/>
    </linearGradient>
    <linearGradient id="codex" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a78f2"/>
      <stop offset="1" stop-color="#5cc0f2"/>
    </linearGradient>
    <linearGradient id="claude" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ec7a55"/>
      <stop offset="1" stop-color="#f3b35a"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <!-- T monogram (T for Token): the bar is Codex's quota, the stem is Claude Code's; fills show what's left. -->
