name: Release

# Publishing a GitHub release tagged vX.Y.Z builds both apps and attaches:
# - macOS: TokenTide-X.Y.Z.zip plus TokenTide-X.Y.Z.zip.sha256, which the in-app updater
#   (macos/Updater.swift) looks for by exact name, and an unversioned TokenTide.zip for the
#   README's releases/latest/download/TokenTide.zip link.
# - Windows: TokenTide-Setup-X.Y.Z.exe plus its .sha256 (windows/updater.mjs), and an
#   unversioned TokenTide-Setup.exe for the README's download link.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build again, e.g. v0.3.0
        required: true
      ref:
        description: Commit or branch to build instead of the tag (optional; replaces the release's files without a new version)
        required: false

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    env:
      # Passed through env, never interpolated into scripts, so a tag name cannot inject shell.
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      SOURCE: ${{ inputs.ref || github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE }}

      - name: Read the version from the tag
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must look like v1.2.3 (got $TAG)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Stamp the version
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build TokenTide.app (arm64 + x86_64)
        run: node scripts/build-macos.mjs --universal

      - name: Package
        working-directory: release
        run: |
          ditto -c -k --keepParent TokenTide.app "TokenTide-$VERSION.zip"
          shasum -a 256 "TokenTide-$VERSION.zip" > "TokenTide-$VERSION.zip.sha256"
          cp "TokenTide-$VERSION.zip" TokenTide.zip
          cat "TokenTide-$VERSION.zip.sha256"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" --clobber \
            "release/TokenTide-$VERSION.zip" \
            "release/TokenTide-$VERSION.zip.sha256" \
            release/TokenTide.zip

  package-windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      SOURCE: ${{ inputs.ref || github.event.release.tag_name || inputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE }}

      - name: Read the version from the tag
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must look like v1.2.3 (got $TAG)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            windows/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm --prefix windows ci

      - name: Stamp the version
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build TokenTide-Setup (x64)
        run: node scripts/build-windows.mjs

      - name: Package
        working-directory: release/windows
        run: |
          cat "TokenTide-Setup-$VERSION.exe.sha256"
          cp "TokenTide-Setup-$VERSION.exe" TokenTide-Setup.exe

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" --clobber \
            "release/windows/TokenTide-Setup-$VERSION.exe" \
            "release/windows/TokenTide-Setup-$VERSION.exe.sha256" \
            release/windows/TokenTide-Setup.exe
